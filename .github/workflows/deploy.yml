name: Deploy to Production

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: REPO_URL
          script: |
            set -e
            echo "Creating deployment directory..."
            mkdir -p /opt/laritmo
            cd /opt/laritmo
            
            echo "Downloading docker-compose configuration..."
            curl -f -o docker-compose.prod.yml https://raw.githubusercontent.com/${REPO_URL}/master/docker-compose.prod.yml
            echo "Configuration downloaded successfully"
        env:
          REPO_URL: ${{ github.repository }}

      - name: Create environment configuration
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: LARITMO_DATABASE_PASSWORD,LARITMO_AUTH_JWT_SECRET,MYSQL_ROOT_PASSWORD,NEWRELIC_LICENSE_KEY
          script: |
            set -e
            cd /opt/laritmo
            
            echo "Creating .env file..."
            cat > .env << EOF
            LARITMO_SERVER_HOST=laritmo.ru
            LARITMO_SERVER_USE_TLS=false
            LARITMO_DATABASE_PASSWORD=${LARITMO_DATABASE_PASSWORD}
            LARITMO_AUTH_JWT_SECRET=${LARITMO_AUTH_JWT_SECRET}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            NEWRELIC_ENABLED=true
            NEWRELIC_LICENSE_KEY=${NEWRELIC_LICENSE_KEY}
            EOF
            echo "Environment configuration created"
        env:
          LARITMO_DATABASE_PASSWORD: ${{ secrets.LARITMO_DATABASE_PASSWORD }}
          LARITMO_AUTH_JWT_SECRET: ${{ secrets.LARITMO_AUTH_JWT_SECRET }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          NEWRELIC_LICENSE_KEY: ${{ secrets.NEWRELIC_LICENSE_KEY }}

      - name: Login to GitHub Container Registry
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            echo "Logging in to GitHub Container Registry..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
            echo "Successfully logged in to GHCR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Pull latest Docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            port: 22
            script: |
              set -e
              echo "Pulling latest image..."
              docker pull ghcr.io/createlab/laritmo:latest
              echo "Image pulled successfully"

      - name: Stop old containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/laritmo
            echo "Stopping old containers..."
            docker compose -f docker-compose.prod.yml down
            echo "Old containers stopped"

      - name: Start new containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/laritmo
            echo "Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d
            echo "Containers started"

      - name: Wait for services to be ready
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: LARITMO_DATABASE_PASSWORD
          script: |
            set -e
            cd /opt/laritmo
            
            echo "Waiting for services to start..."
            sleep 15
            
            echo "Checking database connectivity..."
            docker compose -f docker-compose.prod.yml exec -T db mariadb \
              -u laritmo \
              -p"${LARITMO_DATABASE_PASSWORD}" \
              laritmo \
              -e "SELECT 'Database is ready' as status;"
            
            echo "Database is accessible"
        env:
          LARITMO_DATABASE_PASSWORD: ${{ secrets.LARITMO_DATABASE_PASSWORD }}

      - name: Apply database migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: LARITMO_DATABASE_PASSWORD
          script: |
            set -e
            cd /opt/laritmo
            
            echo "Applying database migrations..."
            docker compose -f docker-compose.prod.yml exec -T app goose \
              -dir /app/migrations \
              mysql "laritmo:${LARITMO_DATABASE_PASSWORD}@tcp(db:3306)/laritmo" \
              up
            
            echo "Migrations applied successfully"
        env:
          LARITMO_DATABASE_PASSWORD: ${{ secrets.LARITMO_DATABASE_PASSWORD }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/laritmo
            
            echo "Checking container status..."
            docker compose -f docker-compose.prod.yml ps
            
            echo "Deployment verification complete!"

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "Cleaning up old Docker images..."
            docker image prune -f
            echo "Cleanup complete"